[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ontoprune"
version = "0.3.0"
description = "Neuro-Symbolic Context Pruning Middleware for Local SLMs"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Vigmar Carlo", email = "vigmarcarlo@gmail.com" }
]
dependencies = [
    "mcp>=1.0.0",
    "rdflib>=7.0.0",
]

[project.urls]
Homepage = "https://github.com/vigmarcarlo/OntoPrune"
Repository = "https://github.com/vigmarcarlo/OntoPrune"
Issues = "https://github.com/vigmarcarlo/OntoPrune/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-benchmark>=4.0.0",
    "ruff>=0.3.0",
]
benchmark = [
    "requests>=2.31.0",
]
languages = [
    "tree-sitter>=0.22.0",
    "tree-sitter-dart>=0.1.0",
    "tree-sitter-java>=0.23.0",
    "tree-sitter-typescript>=0.23.0",
]

[project.scripts]
ontoprune = "ontoprune.cli:main"
ontoprune-mcp = "ontoprune.server:run_stdio"

[tool.hatch.build.targets.wheel]
packages = ["src/ontoprune"]

[tool.hatch.build.targets.wheel.package-data]
ontoprune = ["*.ttl"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501", "E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
